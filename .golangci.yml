linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    enable-all: true
  
  goimports:
    local-prefixes: radic
  
  gocyclo:
    min-complexity: 15

linters:
  enable-all: true
  disable:
    - godot
    - varnamelen
    - wrapcheck

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck

run:
  timeout: 5m
